[package]
name = "meme"
description = "Solidon meme: NEP-141 token with locked treasury parameters"
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/yeheskieltame/solidon"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk.workspace = true
near-contract-standards.workspace = true
uint = { version = "0.10", default-features = false }

[dev-dependencies]
near-sdk = { workspace = true, features = ["unit-testing"] }
near-workspaces = "0.24"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serde_json = "1"
anyhow = "1"
